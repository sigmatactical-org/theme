name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.0"
  NODE_VERSION: "22"
  CARGO_FEATURES: askama,axum,warp
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Build TypeScript
        working-directory: ts
        run: npm ci && npm run check && npm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-targets --features ${{ env.CARGO_FEATURES }} -- --test-threads=1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Build TypeScript
        working-directory: ts
        run: npm ci && npm run check && npm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --features ${{ env.CARGO_FEATURES }} -- -D warnings

  bundles:
    # Consumers depend on this crate over git and embed the built bundles, so
    # they cannot run esbuild themselves: the output under assets/ is committed
    # and has to match ts/src.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Rebuild bundles from ts/src
        working-directory: ts
        run: npm ci && npm run build
      - name: Committed bundles match ts/src
        run: |
          if ! git diff --exit-code --stat -- assets; then
            echo "::error::Committed bundles are stale. Run 'npm run build' in ts/ and commit assets/." >&2
            exit 1
          fi

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies
        run: cargo audit
